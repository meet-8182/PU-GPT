# upstream PU-GPT backend
upstream app_backend {
  server 127.0.0.1:3001;
  keepalive 32;
}

# TLS (sample certificate paths - adjust for production)
# ssl_certificate     /etc/letsencrypt/live/pu-gpt.example.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/pu-gpt.example.com/privkey.pem;
# ssl_protocols       TLSv1.2 TLSv1.3;
# ssl_ciphers         HIGH:!aNULL:!MD5;

server {
  listen 80;
  server_name pu-gpt.example.com;

  # Redirect HTTP to HTTPS (uncomment when certs are provisioned)
  # return 301 https://$host$request_uri;

  # --- Security Headers ---
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-no-referrer" always;
  add_header Content-Security-Policy "default-src 'self' data: https:" always;
  add_header X-Request-ID "$request_id" always;

  # --- Gzip ---
  gzip on;
  gzip_disable "MSIE 6";
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # --- Immutable caching for hashed assets ---
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # --- No-cache for index.html and /api ---
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location /api {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate, private" always;
    proxy_pass http://app_backend;
  }

  # --- Streaming chat route ---
  location /api/chat/ask {
    # Streaming settings
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_set_header Connection "keep-alive";
    chunked_transfer_encoding on;
    upstream_http_force_rmlf on;

    # X-Accel-Buffering: no so the response passes through transparently
    add_header X-Accel-Buffering "no";

    # --- Upload size limit ---
    client_max_body_size 10M;

    # --- Rate-limit zone ---
    # (rate limiting is best done in nginx config, referenced via limit_req_zone above)

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Access log without query strings or bodies ---
    access_log /var/log/nginx/pu-gpt-access.log main;

    # --- Pass request ID ---
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # --- Backend health ---
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
  }

  # --- Health endpoints ---
  location = /health/live {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain always;
  }

  location = /health/ready {
    access_log off;
    proxy_pass http://app_backend/health/ready;
    add_header Content-Type text/plain always;
  }

  # --- Static frontend assets (served from /dist) ---
  location /dist/ {
    alias /app/dist/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # --- Fallback to index.html for SPA routing ---
  location / {
    try_files $uri $uri/ /index.html;
  }
}